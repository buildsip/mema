<!--
  Two columns.
  Left container: the project repo.
  Right column: personal, team, and organization repos, each in its own container.
  A line separates each row inside a container.
  Colored labels sit outside the container, on the same row as the folder or file they describe.

  Text y is the baseline. On the system font, the middle of the letter box
  sits 5.1px above that baseline at 13.5px, and 4.5px above it at 12px.
-->
